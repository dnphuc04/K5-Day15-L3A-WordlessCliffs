services:
  - type: web
    name: wordless-cliffs-demo
    runtime: python
    plan: free
    branch: main
    buildCommand: python -m pip install -r requirements.txt
    startCommand: python docs/ui-prototype/serve.py
    healthCheckPath: /healthz
    envVars:
      - key: DEMO_PASSWORD
        generateValue: true
      - key: MODEL_PROVIDER
        value: fake
